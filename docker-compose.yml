# Starts the whole app: docker compose up --build, then open http://localhost:8080
# For development, start only the database: docker compose up -d mongo
services:
  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Loads the brief's sample movies and cinemas, but only into an empty database
  seed:
    build: ./server
    command: ["node", "dist/scripts/seed.js", "--if-empty"]
    environment:
      MONGO_URI: mongodb://mongo:27017/mern_app
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

  server:
    build: ./server
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/mern_app
      CLIENT_URL: http://localhost:8080
    depends_on:
      mongo:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  client:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo-data:
